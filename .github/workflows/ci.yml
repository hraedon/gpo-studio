name: ci
# Scoped to main rather than bare `push`: with `on: [push, pull_request]`, a
# push to a branch with an open PR fires BOTH events, running every job twice.
# At 13 jobs that is 26 concurrent jobs from one push, against an account-wide
# cap of 20 -- the run then starves itself and jobs sit queued for over an hour
# without ever being scheduled.
on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this workflow so every job here runs, and must pass, on
  # the exact tagged commit before anything is published.
  workflow_call:

# Supersede in-flight runs for the same ref so an amend-and-force-push does not
# leave the previous run's jobs holding runner slots. Only for pull_request:
# main-branch runs are the record of what landed and are left to complete.
#
# The group is spelled with a literal name, not `github.workflow`: when
# release.yml calls this workflow, `github.workflow` is the caller's name, and
# this group would then collide with identifier-gate.yml's in the same run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 11 min observed at 1.1.0rc1; the limit leaves room for a slow runner.
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    permissions:
      contents: read
    steps:
      # Full history: the evidence registry tests resolve every banked verdict's
      # recorded (commit, path, sha256) against `git show <commit>:<path>`, and
      # a depth-1 checkout does not carry the frozen harness commits.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # `--locked` below already refuses a stale lockfile; this step says so by
      # name, so a pyproject.toml edit without `uv lock` fails here, first.
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - name: Install
        run: uv sync --locked --extra dev
      # Offline, from a cache holding only the locked backend: the editable
      # project build must use it, and an isolated build must fail (control).
      - name: The project builds only with the locked backend
        run: >-
          uv run --locked python -I scripts/check_locked_build_backend.py
          --tmp-root "$RUNNER_TEMP/backend-check"
      - name: Ruff
        run: uv run --locked ruff check .
      - name: Mypy
        run: uv run --locked mypy src
      - name: Pytest
        run: >-
          uv run --locked pytest -q --cov=src/gpo_studio --cov-branch
          --cov-report=json:coverage.json
      - name: Risk-based coverage floors
        run: uv run --locked python -I scripts/check_coverage.py coverage.json

  test-windows:
    # Windows mirror of `test`, ENFORCING since 2026-09-06. The baseline it was
    # added at is closed: mypy's 25 win32 errors (D2 -- the platform checks
    # routed through an `_IS_WINDOWS` intermediate that mypy cannot narrow),
    # the 32 symlink failures (D3 -- they now skip on the privilege rather than
    # the platform), the 2 ArtifactStore handle leaks that made a temporary
    # directory undeletable, the parent-swap race tests' liveness guard (a coin
    # flip on a loaded runner: 2 of the first 5 jobs), and the coverage gate's
    # `/`-spelled floors, which matched nothing against win32's `\`-keyed
    # coverage.json -- so all eleven per-module floors had never once been
    # enforced here. Neither of the last two was reachable from a green local
    # win32 pytest run: one needed the job's own history, the other sat behind
    # a step that had always failed first.
    #
    # Windows is where this project's operator, release
    # target and evidence harness live, and a class of defect is invisible
    # without it: `486874f` had to repair EOL smudging that broke six evidence
    # anchors and sixteen harness bindings, which no Linux job could observe.
    # The install goes through uv and the committed lockfile, as every Python
    # install in this file and release.yml does.
    runs-on: windows-latest
    # 12-20 min observed at 1.1.0rc1, and the v1.1.0-rc.1 release run's 3.13
    # job was cancelled at 20m13s.
    timeout-minutes: 40
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    permissions:
      contents: read
    steps:
      # Full history, same reason as the Linux test job.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Ruff
        run: uv run --locked ruff check .
      - name: Mypy
        run: uv run --locked mypy src
      - name: Pytest
        run: >-
          uv run --locked pytest -q --cov=src/gpo_studio --cov-branch
          --cov-report=json:coverage.json
      - name: Risk-based coverage floors
        run: uv run --locked python -I scripts/check_coverage.py coverage.json

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          python-version: "3.13"
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - name: Install application
        run: uv sync --locked --extra dev
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Audit frontend tooling dependencies
        run: npm audit --audit-level=high
      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install browser binaries
        run: node_modules/.bin/playwright install --with-deps chromium firefox
      - name: Frontend checks
        run: npm run check
      - name: Browser tests
        # The server runs from the locked environment, not whatever `python`
        # is first on PATH (tests/browser/start-server.mjs).
        env:
          GPO_STUDIO_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: npm run test:browser
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  installed-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          python-version: "3.13"
          enable-cache: true
      - name: Build sdist and wheel
        env:
          SOURCE_DATE_EPOCH: "315532800"
        # The locked `build` and hatchling (dependency group `release`), not an
        # isolated build environment that resolves the backend at run time.
        run: |
          uv run --locked --only-group release python -I -m build --no-isolation --outdir dist
          uv run --locked --only-group release python -I -m build --no-isolation --outdir dist-repro
          for artifact in dist/*; do
            cmp "$artifact" "dist-repro/$(basename "$artifact")"
          done
      # Hash-pinned requirements from uv.lock: the runtime closure the release
      # publishes as requirements-lock.txt, and the locked build backend for
      # installing an sdist without an isolated (unpinned) build. Written outside
      # the checkout so neither file can end up inside a built sdist.
      - name: Export locked requirements
        run: |
          mkdir -p "$RUNNER_TEMP/locked"
          uv export --locked --no-default-groups --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/locked/requirements-lock.txt" > /dev/null
          uv export --locked --only-group build-backend --no-emit-project \
            --format requirements.txt \
            --output-file "$RUNNER_TEMP/locked/build-backend-lock.txt" > /dev/null
      # The built artifact itself, with --no-deps --no-index: every dependency
      # comes from the hash-checked locked set, and `pip check` proves that set
      # satisfies the wheel's own metadata.
      - name: Install wheel and sdist in clean environments
        run: |
          LOCKED="$RUNNER_TEMP/locked"
          python -I -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --only-binary :all: --require-hashes -r "$LOCKED/requirements-lock.txt"
          /tmp/smoke-venv/bin/pip install --only-binary :all: --no-deps --no-index dist/gpo_studio-*.whl
          /tmp/smoke-venv/bin/pip check
          python -I -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --only-binary :all: --require-hashes \
            -r "$LOCKED/requirements-lock.txt" -r "$LOCKED/build-backend-lock.txt"
          /tmp/sdist-venv/bin/pip install --no-deps --no-index --no-build-isolation \
            dist/gpo_studio-*.tar.gz
          /tmp/sdist-venv/bin/pip check
      - name: Verify version consistency
        run: |
          VENV_VERSION=$(/tmp/smoke-venv/bin/python -I scripts/print_installed_version.py)
          META_VERSION=$(/tmp/smoke-venv/bin/python -I scripts/print_installed_version.py --metadata)
          if [ "$VENV_VERSION" != "$META_VERSION" ]; then
            echo "FAIL: __version__ ($VENV_VERSION) != metadata ($META_VERSION)"
            exit 1
          fi
          echo "Version: $VENV_VERSION (consistent)"
          SDIST_VERSION=$(/tmp/sdist-venv/bin/python -I scripts/print_installed_version.py)
          test "$VENV_VERSION" = "$SDIST_VERSION"
      - name: Verify CLI entry point
        run: /tmp/smoke-venv/bin/gpo-studio --help
      - name: Start server and smoke-test API
        run: |
          set -euo pipefail
          /tmp/smoke-venv/bin/gpo-studio run --database /tmp/smoke.db --port 8799 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            curl -sf http://127.0.0.1:8799/api/health > /tmp/health.json && break
            sleep 0.25
          done
          /tmp/smoke-venv/bin/python -I scripts/check_health_version.py /tmp/health.json
          # Create a GPO
          curl -sf -X POST http://127.0.0.1:8799/api/gpos \
            -H "Content-Type: application/json" \
            -d '{"name":"Smoke Test","domain":"test.local","actor":"ci","reason":"installed-package smoke test"}' > /dev/null
          # List GPOs (verify 200)
          curl -sf http://127.0.0.1:8799/api/gpos > /dev/null
          # Static UI
          curl -sf http://127.0.0.1:8799/ > /dev/null
          kill $SERVER_PID
          wait $SERVER_PID || true
          trap - EXIT
      - name: Verify sdist excludes
        run: |
          SDIST=$(ls dist/gpo_studio-*.tar.gz)
          if tar tzf "$SDIST" | grep -qE '\.db$|\.sqlite3$|\.venv/|node_modules/|\.claude/|githooks/|reflections/|exports/|playwright-report/|test-results/'; then
            echo "FAIL: sdist contains excluded content"
            tar tzf "$SDIST" | grep -E '\.db$|\.sqlite3$|\.venv/|node_modules/|\.claude/|githooks/|reflections/|exports/|playwright-report/|test-results/'
            exit 1
          fi
          echo "sdist excludes verified"
      - name: Verify sdist contains required files
        run: |
          SDIST=$(ls dist/gpo_studio-*.tar.gz)
          for required in README.md LICENSE pyproject.toml AGENTS.md SECURITY.md CHANGELOG.md CONTRIBUTING.md; do
            if ! tar tzf "$SDIST" | grep -q "/$required$"; then
              echo "FAIL: sdist missing $required"
              exit 1
            fi
          done
          echo "sdist contains all required files"
      - name: Rehearse upgrade and rollback with installed wheel
        run: /tmp/smoke-venv/bin/python -I scripts/rehearse_upgrade_rollback.py
      - name: Upload candidate distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          python-version: "3.13"
          enable-cache: true
      # Hash-pinned requirements from uv.lock: the runtime closure the release
      # publishes as requirements-lock.txt, and the locked build backend for
      # installing an sdist without an isolated (unpinned) build. Written outside
      # the checkout so neither file can end up inside a built sdist.
      - name: Export locked requirements
        run: |
          mkdir -p "$RUNNER_TEMP/locked"
          uv export --locked --no-default-groups --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/locked/requirements-lock.txt" > /dev/null
          uv export --locked --only-group build-backend --no-emit-project \
            --format requirements.txt \
            --output-file "$RUNNER_TEMP/locked/build-backend-lock.txt" > /dev/null
      - name: Install
        run: |
          uv run --locked --only-group release python -I -m build --no-isolation --wheel
          python -I -m venv /tmp/audit-venv
          /tmp/audit-venv/bin/pip install --only-binary :all: --require-hashes \
            -r "$RUNNER_TEMP/locked/requirements-lock.txt"
          /tmp/audit-venv/bin/pip install --only-binary :all: --no-deps --no-index dist/gpo_studio-*.whl
          /tmp/audit-venv/bin/pip check
          /tmp/audit-venv/bin/pip uninstall --yes pip
      # The audit reads the locked file itself, not one environment's
      # `pip freeze`. pip-audit evaluates environment markers against this
      # Linux runner, so the markers are dropped first: every package the lock
      # pins for any platform is audited (colorama is Windows-only). Licenses
      # are read from the installed Linux environment, so they cover its set.
      - name: Audit shipped dependencies
        run: |
          python -I scripts/requirements_all_platforms.py \
            "$RUNNER_TEMP/locked/requirements-lock.txt" \
            "$RUNNER_TEMP/locked/requirements-all-platforms.txt"
          uv run --locked --only-group release pip-audit --strict --require-hashes \
            --disable-pip --requirement "$RUNNER_TEMP/locked/requirements-all-platforms.txt"
          uv run --locked --only-group release pip-licenses \
            --python /tmp/audit-venv/bin/python \
            --allow-only 'MIT;MIT License;MIT-0;BSD-2-Clause;BSD-3-Clause;Apache-2.0 OR BSD-2-Clause;Apache-2.0 OR BSD-3-Clause;MPL-2.0;Mozilla Public License 2.0 (MPL 2.0);PSF-2.0'

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          python-version: "3.13"
          enable-cache: true
      # Hash-pinned requirements from uv.lock: the runtime closure the release
      # publishes as requirements-lock.txt, and the locked build backend for
      # installing an sdist without an isolated (unpinned) build. Written outside
      # the checkout so neither file can end up inside a built sdist.
      - name: Export locked requirements
        run: |
          mkdir -p "$RUNNER_TEMP/locked"
          uv export --locked --no-default-groups --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/locked/requirements-lock.txt" > /dev/null
          uv export --locked --only-group build-backend --no-emit-project \
            --format requirements.txt \
            --output-file "$RUNNER_TEMP/locked/build-backend-lock.txt" > /dev/null
      - name: Build wheel
        run: |
          uv run --locked --only-group release python -I -m build --no-isolation --wheel
          python -I -m venv /tmp/sbom-venv
          /tmp/sbom-venv/bin/pip install --only-binary :all: --require-hashes \
            -r "$RUNNER_TEMP/locked/requirements-lock.txt"
          /tmp/sbom-venv/bin/pip install --only-binary :all: --no-deps --no-index dist/gpo_studio-*.whl
          /tmp/sbom-venv/bin/pip check
          /tmp/sbom-venv/bin/pip uninstall --yes pip
      - name: Generate SBOM
        run: |
          uv run --locked --only-group release cyclonedx-py environment \
            /tmp/sbom-venv/bin/python \
            --pyproject pyproject.toml \
            --output-reproducible \
            --output-format JSON \
            --output-file sbom.cdx.json
          python -I scripts/finalize_sbom.py sbom.cdx.json \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA"
      - name: Verify SBOM
        run: |
          if [ ! -s sbom.cdx.json ]; then
            echo "FAIL: SBOM is empty or missing"
            exit 1
          fi
          python -I scripts/check_sbom_shape.py sbom.cdx.json
          echo "SBOM generated: $(stat -c%s sbom.cdx.json) bytes"
      - name: Upload SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Run static safety checks
        run: uv run --locked python -I scripts/check_safety.py

  identifier-gate-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Test identifier gate fail-closed behavior
        run: uv run --locked pytest tests/test_identifier_gate.py -q

  powershell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Fetch PSScriptAnalyzer
        shell: pwsh
        # Pinned by content, as uv.lock and package-lock.json pin everything
        # else: the 1.25.0 package from PSGallery must have this SHA-256 (the
        # gallery's own SHA-512 for it, 5/tXMmLm...ExwWYw==, was cross-checked
        # when the value was recorded). Nothing is installed: the verified
        # package is unpacked under RUNNER_TEMP and the analyzer step imports it
        # from there. An exact version alone is not a lock.
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'psscriptanalyzer'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $package = Join-Path $root 'PSScriptAnalyzer.1.25.0.zip'
          Invoke-WebRequest -Uri 'https://www.powershellgallery.com/api/v2/package/PSScriptAnalyzer/1.25.0' -OutFile $package
          $expected = '14E634C828EB98EFB9F40B2918BA90F139ED5ECCDF663A2A747736D996995D60'
          $actual = (Get-FileHash -Path $package -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "PSScriptAnalyzer package SHA-256 is $actual, not $expected" }
          Expand-Archive -Path $package -DestinationPath (Join-Path $root 'module')
      - name: Parse every script
        shell: pwsh
        # Cheap, and catches what an analyzer run cannot: a file that does not
        # parse produces no findings at all, which reads identically to a clean
        # file if the analyzer is the only gate.
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          # Repo-wide rather than scripts/-only, so a .ps1 added elsewhere
          # cannot escape the gate -- but vendored trees are not ours to fix,
          # and including them would make a local run disagree with CI, whose
          # checkout has no node_modules.
          Get-ChildItem -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' } |
            ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              Write-Output "::error file=$($_.Name)::$($errors.Count) parse error(s)"
              $errors | ForEach-Object { Write-Output "  line $($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
          Write-Output "All scripts parse."
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:RUNNER_TEMP 'psscriptanalyzer/module/PSScriptAnalyzer.psd1') -Force
          $targets = @(
            Get-ChildItem -Recurse -Include *.ps1, *.psm1, *.psd1 |
              Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' } |
              ForEach-Object { $_.FullName }
          )
          $findings = @($targets | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Settings ./PSScriptAnalyzerSettings.psd1
          })
          if ($findings) {
            $findings | ForEach-Object {
              Write-Output "::error file=$($_.ScriptName),line=$($_.Line)::[$($_.RuleName)] $($_.Message)"
            }
            Write-Output "$($findings.Count) finding(s)."
            exit 1
          }
          Write-Output "PSScriptAnalyzer: no findings."

  property-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Run bounded parser and codec properties
        run: uv run --locked pytest tests/test_properties.py -q

  type-fuzz-full:
    # The exhaustive stored-type fuzz (tests/test_stored_type_fuzz.py): every
    # stored field x every JSON type in the whole sample GPO, and 174 fields
    # through every GPO route. 13-14 min on a 12-vCPU dev host (2026-10-18),
    # too long for the test jobs' budgets, so the default suite runs a reduced
    # fuzz (~80 s) and this job runs the full one, on Linux only.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Run the exhaustive stored-type fuzz
        env:
          GPO_STUDIO_FULL_FUZZ: "1"
        run: uv run --locked pytest tests/test_stored_type_fuzz.py -q

  mutation-check:
    # Restores defects a self-consistent round-trip test cannot see (a parser
    # that reads nothing, a comparator that always agrees, an export that
    # ignores what import retained) in throwaway copies of the tree, and
    # requires the tests named for each to fail. 17 mutants took 36-68 s on a
    # 12-vCPU dev host across three runs (2026-10-09/10), depending on load;
    # 20 took 43 s there (2026-10-10).
    # A surviving mutant exits 1.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Kill every round-trip mutant
        run: >-
          uv run --locked python -I scripts/mutation_check_roundtrip.py
          --tmp-root "$RUNNER_TEMP/mutants"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
