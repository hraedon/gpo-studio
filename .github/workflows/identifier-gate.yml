name: identifier-gate
# See ci.yml: bare `push` double-fires alongside `pull_request` on any branch
# with an open PR.
on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this gate on the tagged commit. The denylist secret must
  # be passed explicitly by the caller; without it a public repo fails closed.
  workflow_call:
    secrets:
      GPO_STUDIO_FORBIDDEN_IDENTIFIERS:
        required: true

# Literal group name: see ci.yml (a called workflow sees the caller's name).
concurrency:
  group: identifier-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  identifier-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0  # gate walks history when publication.toml is absent; refuses shallow
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Gate contract (publication visibility is a closed set)
        run: python3 tests/test_identifier_gate_visibility.py
      - name: Check for committed work-domain identifiers
        env:
          GPO_STUDIO_FORBIDDEN_IDENTIFIERS: ${{ secrets.GPO_STUDIO_FORBIDDEN_IDENTIFIERS }}
        run: python3 scripts/check_committed_identifiers.py --strict
