name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

# Nothing is published unless, for the exact tagged commit:
#   release-identity  the tag, __version__ and that version's own evidence
#                     manifest agree, and the manifest is approved (or marked
#                     as a candidate for an -rc tag); the commit is on main;
#   ci                every ci.yml job passes, including test-windows;
#   identifier-gate   the committed-identifier gate passes;
#   verify            the release gates below pass.
# publish re-runs the identity check, so dropping the job dependency in a later
# edit does not also drop the version-bound approval check.
jobs:
  release-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      manifest: ${{ steps.manifest.outputs.manifest }}
      report: ${{ steps.manifest.outputs.report }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Check tag, version and evidence manifest
        id: manifest
        run: >-
          python scripts/check_release_manifest.py
          --tag "${GITHUB_REF_NAME}"
          --github-output "${GITHUB_OUTPUT}"
          --remote-tag-sha "${GITHUB_SHA}"
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Refusing to release ${GITHUB_SHA}: it is not reachable from origin/main."
            exit 1
          fi

  ci:
    needs: release-identity
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  identifier-gate:
    needs: release-identity
    uses: ./.github/workflows/identifier-gate.yml
    permissions:
      contents: read
    secrets:
      GPO_STUDIO_FORBIDDEN_IDENTIFIERS: ${{ secrets.GPO_STUDIO_FORBIDDEN_IDENTIFIERS }}

  verify:
    needs: release-identity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      # Full history, as in ci.yml: the evidence-registry and release-upgrade
      # tests resolve recorded commits and the v1.0.0 tag with `git show`.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - name: Install application and test dependencies
        run: |
          pip install -e '.[dev]'
          npm ci
          npx playwright install --with-deps chromium firefox
      - name: Run release gates
        run: |
          ruff check .
          mypy src
          pytest -q --cov=src/gpo_studio --cov-branch --cov-report=json:coverage.json
          python scripts/check_coverage.py coverage.json
          python scripts/check_safety.py
          python scripts/rehearse_upgrade_rollback.py
          npm run check
          npm run test:browser

  publish:
    needs: [release-identity, ci, identifier-gate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Verify immutable release identity
        id: manifest
        env:
          EXPECTED_MANIFEST: ${{ needs.release-identity.outputs.manifest }}
          EXPECTED_REPORT: ${{ needs.release-identity.outputs.report }}
        run: |
          python scripts/check_release_manifest.py \
            --tag "${GITHUB_REF_NAME}" --github-output "${GITHUB_OUTPUT}"
          grep -qxF "manifest=${EXPECTED_MANIFEST}" "${GITHUB_OUTPUT}"
          grep -qxF "report=${EXPECTED_REPORT}" "${GITHUB_OUTPUT}"
      - name: Install release tools
        run: pip install build cyclonedx-bom
      - name: Build reproducible distributions
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          python -m build --outdir dist
          python -m build --outdir dist-repro
          for artifact in dist/*; do
            cmp "$artifact" "dist-repro/$(basename "$artifact")"
          done
      # What is published must be what was approved: the version Hatchling wrote
      # into the wheel's METADATA and the sdist's PKG-INFO, not only the one the
      # gate read from __init__.py.
      - name: Require the built distributions to carry the approved version
        run: |
          mapfile -t WHEELS < <(find dist -maxdepth 1 -name 'gpo_studio-*.whl')
          mapfile -t SDISTS < <(find dist -maxdepth 1 -name 'gpo_studio-*.tar.gz')
          test "${#WHEELS[@]}" -eq 1 && test "${#SDISTS[@]}" -eq 1
          python scripts/check_release_manifest.py --tag "${GITHUB_REF_NAME}" \
            --wheel "${WHEELS[0]}" --sdist "${SDISTS[0]}"
      - name: Validate exact wheel
        run: |
          WHEEL=$(find dist -maxdepth 1 -name 'gpo_studio-*.whl' -print -quit)
          PYTHON=python GPO_STUDIO_WHEEL="$WHEEL" bash scripts/installed_package_smoke.sh
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install "$WHEEL"
      - name: Validate exact source distribution
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install dist/gpo_studio-*.tar.gz
          /tmp/sdist-venv/bin/gpo-studio --help > /dev/null
      - name: Rehearse upgrade and rollback with exact wheel
        run: /tmp/wheel-venv/bin/python scripts/rehearse_upgrade_rollback.py
      - name: Generate resolved evidence, SBOM, and checksums
        env:
          EVIDENCE_MANIFEST: ${{ steps.manifest.outputs.manifest }}
          EVIDENCE_REPORT: ${{ steps.manifest.outputs.report }}
        run: |
          python -m venv /tmp/sbom-venv
          /tmp/sbom-venv/bin/pip install dist/gpo_studio-*.whl
          /tmp/sbom-venv/bin/pip uninstall --yes pip
          cyclonedx-py environment /tmp/sbom-venv/bin/python \
            --pyproject pyproject.toml \
            --output-reproducible \
            --output-format JSON \
            --output-file sbom.cdx.json
          python scripts/finalize_sbom.py sbom.cdx.json \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA"
          # The manifest the identity gate approved for this version, never a
          # fixed file name (which once meant 1.0.0's manifest for every tag).
          cp "${EVIDENCE_MANIFEST}" release-evidence.md
          cp "${EVIDENCE_REPORT}" release-evidence-report.json
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          wheel = next(Path("dist").glob("gpo_studio-*.whl"))
          sdist = next(Path("dist").glob("gpo_studio-*.tar.gz"))
          sbom = Path("sbom.cdx.json")
          artifacts = {
              "wheel_sha256": sha256(wheel),
              "sdist_sha256": sha256(sdist),
              "sbom_sha256": sha256(sbom),
          }

          report_path = Path("release-evidence-report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          report["release_identity"] = {
              "source_commit": os.environ["GITHUB_SHA"],
              "tag": os.environ["GITHUB_REF_NAME"],
          }
          report["artifact_hashes"].update(artifacts)
          report["artifact_hashes"].pop("evidence_report_sha256", None)
          report_path.write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          with Path("release-evidence.md").open("a", encoding="utf-8") as stream:
              stream.write("\n## Resolved release identity\n\n")
              stream.write(f"- Source commit: `{os.environ['GITHUB_SHA']}`\n")
              stream.write(f"- Tag: `{os.environ['GITHUB_REF_NAME']}`\n")
              stream.write(f"- Wheel `{wheel.name}` SHA-256: `{artifacts['wheel_sha256']}`\n")
              stream.write(f"- Source distribution `{sdist.name}` SHA-256: `{artifacts['sdist_sha256']}`\n")
              stream.write(f"- SBOM SHA-256: `{artifacts['sbom_sha256']}`\n")
          PY
          sha256sum dist/* sbom.cdx.json release-evidence.md release-evidence-report.json > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*
            SHA256SUMS
            release-evidence.md
            release-evidence-report.json
      - name: Attest release SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/*
          sbom-path: sbom.cdx.json
      # Last check before publication: the remote tag must still peel to the
      # commit this run built. `gh release create --verify-tag` only checks
      # that a tag of that name exists, so a tag moved mid-run would otherwise
      # receive this commit's artifacts. A narrow race remains between this
      # step and the next; tag protection rules close it.
      - name: Require the remote tag to still name the built commit
        run: >-
          python scripts/check_release_manifest.py
          --tag "${GITHUB_REF_NAME}"
          --remote-tag-sha "${GITHUB_SHA}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=()
          NOTES_ARGS=(--generate-notes)
          case "$GITHUB_REF_NAME" in
            *-rc.*)
              FLAGS+=(--prerelease)
              NOTES_ARGS=(--notes "Immutable release candidate for hands-on validation. This prerelease is not approved for production or as the final ${GITHUB_REF_NAME%-rc.*} release. Download the wheel and SHA256SUMS from Assets and follow docs/nvda-validation-runbook.md.")
              ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            dist/* sbom.cdx.json SHA256SUMS release-evidence.md release-evidence-report.json \
            --verify-tag "${NOTES_ARGS[@]}" \
            --title "GPO Studio ${GITHUB_REF_NAME#v}" "${FLAGS[@]}"
